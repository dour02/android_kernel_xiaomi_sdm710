name: grus KernelSU-Next

on:
  workflow_dispatch:

env:
  KSU_BRANCH: legacy
  # 内核对外报告的 UAPI 版本，需与管理器一致（管理器首页“管理器版本”括号里横线后的数字）。
  # legacy 最新代码是 6，已发布的管理器 v3.4.2 是 5；6 相对 5 只是新增接口，
  # 所以改报 5 即可让 v3.4.2 管理器完整工作。官方发布 UAPI 6 的管理器后改成 "6"。
  KSU_UAPI: "5"   # 正式版管理器 v3.4.2 = 5；换 CI 版管理器 (UAPI 6) 时改成 "6"

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential curl flex git \
            libelf-dev libssl-dev lz4 python3 zip cpio device-tree-compiler

      - name: Toolchain
        run: |
          git clone --depth=1 https://github.com/kdrag0n/proton-clang $HOME/tc
          echo "$HOME/tc/bin" >> $GITHUB_PATH
          # vdso32 用 clang --prefix=<CROSS_COMPILE_ARM32 所在目录> 找 ld。
          # proton-clang/bin 里的 "ld" 是 x86 的，会导致
          # "unrecognised emulation mode: armelf_linux_eabi"。
          # 所以单独建一个只含 ARM32 binutils 的目录。
          mkdir -p $HOME/arm32
          for f in $HOME/tc/bin/arm-linux-gnueabi-*; do ln -sf "$f" $HOME/arm32/; done
          ln -sf $HOME/tc/bin/arm-linux-gnueabi-ld $HOME/arm32/ld
          ln -sf $HOME/tc/bin/arm-linux-gnueabi-as $HOME/arm32/as

      - name: Integrate KernelSU-Next
        run: |
          curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" | bash -s $KSU_BRANCH
          # 让内核报告的 UAPI 版本与管理器一致（只在当前值为 6 时修改，代码变了会报错提醒）
          H=KernelSU-Next/uapi/supercall.h
          grep -E "^#define KERNEL_SU_UAPI_VERSION [0-9]+$" $H
          if [ "$KSU_UAPI" != "$(grep -oE "^#define KERNEL_SU_UAPI_VERSION [0-9]+$" $H | grep -oE "[0-9]+$")" ]; then
            grep -q "^#define KERNEL_SU_UAPI_VERSION 6$" $H
            sed -i "s/^#define KERNEL_SU_UAPI_VERSION 6$/#define KERNEL_SU_UAPI_VERSION $KSU_UAPI/" $H
          fi
          grep -E "^#define KERNEL_SU_UAPI_VERSION $KSU_UAPI$" $H

      - name: Fix KernelSU-Next for old kernel_read API (<= 4.13)
        run: |
          # 4.9 的 kernel_read 参数顺序是 (file, offset, buf, count)，
          # KernelSU-Next legacy 多处直接按 4.14+ 的 (file, buf, count, pos) 调用，
          # 导致读 APK 签名 / packages.list / allowlist 全部失败 -> 管理器检测不到 root。
          # 改为调用 KernelSU 自带的兼容函数。4.14+ 内核自动跳过。
          if grep -q "ssize_t kernel_read" fs/read_write.c; then
            echo "new kernel_read API, skip"; exit 0
          fi
          cd KernelSU-Next/kernel
          files=$(grep -rlE '(^|[^_[:alnum:]])kernel_(read|write)\(' --include=*.c . | grep -v 'compat/kernel_compat\.c' || true)
          for f in $files; do
            sed -i -E 's/(^|[^_[:alnum:]])kernel_read\(/\1ksu_kernel_read_compat(/g; s/(^|[^_[:alnum:]])kernel_write\(/\1ksu_kernel_write_compat(/g' "$f"
            grep -q 'compat/kernel_compat.h' "$f" || sed -i '0,/^#include/s//#include "compat\/kernel_compat.h"\n#include/' "$f"
            echo "patched: $f"
          done

      - name: Fix SELinux AVC seqno for kernels without selinux_state (4.9)
        run: |
          # KernelSU-Next on kernels without selinux_state (4.9): after editing the policy
          # in place it flushed the AVC with its own local seqno (2, 3, ...) while the
          # security server kept handing out latest_granting = 1. From then on every
          # avc_insert() is rejected ("SELinux: avc: seqno 1 < latest_notif 2"), the AVC
          # never caches anything and the log floods. Bump the real latest_granting instead.
          set -e
          RULES=KernelSU-Next/kernel/selinux/rules.c
          SS=security/selinux/ss/services.c

          if ! grep -q "^static u32 latest_granting;$" "$SS"; then
            echo "kernel has selinux_state (>= 4.14 style), KernelSU uses its seqno, skip"; exit 0
          fi
          if ! grep -q "static u32 ksu_avc_seqno = 1;" "$RULES"; then
            grep -q "ksu_selinux_next_seqno" "$RULES" && { echo "already patched"; exit 0; }
            echo "rules.c: KernelSU code changed, please re-check this fix"; exit 1
          fi
          grep -q "^static DEFINE_RWLOCK(policy_rwlock);$\|^DEFINE_RWLOCK(policy_rwlock);$" "$SS" || { echo "services.c: policy_rwlock not found"; exit 1; }

          if ! grep -q "ksu_selinux_next_seqno" "$SS"; then
            python3 - "$SS" <<'EOF'
          import sys
          p = sys.argv[1]
          s = open(p).read()
          helper = '''static u32 latest_granting;

          #ifdef CONFIG_KSU
          /* KernelSU-Next: hand out a real policy seqno after in-place policy edits */
          u32 ksu_selinux_next_seqno(void)
          {
          	u32 seqno;

          	write_lock_irq(&policy_rwlock);
          	seqno = ++latest_granting;
          	write_unlock_irq(&policy_rwlock);
          	return seqno;
          }
          #endif
          '''
          s = s.replace('static u32 latest_granting;\n', helper, 1)
          open(p, 'w').write(s)
          EOF
            echo "patched: $SS"
          fi

          python3 - "$RULES" <<'EOF'
          import sys
          p = sys.argv[1]
          s = open(p).read()
          old = '''	static u32 ksu_avc_seqno = 1;
          	u32 seqno = ++ksu_avc_seqno;'''
          new = '''	extern u32 ksu_selinux_next_seqno(void);
          	u32 seqno = ksu_selinux_next_seqno();'''
          assert s.count(old) == 1, 'rules.c: local seqno block not found'
          open(p, 'w').write(s.replace(old, new))
          EOF
          echo "patched: $RULES"

      - name: Apply KernelSU-Next manual hooks
        # 4.9 内核不支持 kprobes hook (需 >=5.10) 和 syscall table hook (需 >=4.17)，
        # 只能用手动 hook。已打过的文件会自动跳过。
        shell: python3 {0}
        run: |
          import sys
          G = '#ifdef CONFIG_KSU_MANUAL_HOOK\n'
          E = '#endif\n'

          def patch(path, anchor, decl, call, call_after, replace=None, post=''):
              s = open(path).read()
              if 'ksu_handle_' in s:
                  print(f'[skip] {path} already hooked'); return
              if anchor not in s:
                  sys.exit(f'[FAIL] anchor not found in {path}')
              new = G + decl + E + '\n' + anchor
              if replace:
                  new = new.replace(replace[0], replace[1])
              new = new.replace(call_after, call_after + '\n' + G + call + E + post, 1)
              s = s.replace(anchor, new, 1)
              open(path, 'w').write(s)
              print(f'[ok]   {path}')

          # kernel/reboot.c  (KernelSU 的 Kbuild 靠这个判断 hook 是否存在)
          patch('kernel/reboot.c',
                'SYSCALL_DEFINE4(reboot, int, magic1, int, magic2, unsigned int, cmd,\n\t\tvoid __user *, arg)\n{\n\tstruct pid_namespace *pid_ns = task_active_pid_ns(current);\n\tchar buffer[256];\n\tint ret = 0;\n',
                'extern int ksu_handle_sys_reboot(int magic1, int magic2, unsigned int cmd,\n\t\t\t\t void __user **arg);\n',
                '\tksu_handle_sys_reboot(magic1, magic2, cmd, &arg);\n',
                '\tint ret = 0;\n')

          # fs/exec.c
          patch('fs/exec.c',
                'static int do_execveat_common(int fd, struct filename *filename,\n\t\t\t      struct user_arg_ptr argv,\n\t\t\t      struct user_arg_ptr envp,\n\t\t\t      int flags)\n{\n\tchar *pathbuf = NULL;\n\tstruct linux_binprm *bprm;\n\tstruct file *file;\n\tstruct files_struct *displaced;\n\tint retval;\n',
                'extern int ksu_handle_execveat(int *fd, struct filename **filename_ptr,\n\t\t\t       void *argv, void *envp, int *flags);\n',
                '\tksu_handle_execveat(&fd, &filename, &argv, &envp, &flags);\n',
                '\tint retval;\n')

          # fs/open.c
          patch('fs/open.c',
                'SYSCALL_DEFINE3(faccessat, int, dfd, const char __user *, filename, int, mode)\n{\n\tconst struct cred *old_cred;\n\tstruct cred *override_cred;\n\tstruct path path;\n\tstruct inode *inode;\n\tstruct vfsmount *mnt;\n\tint res;\n\tunsigned int lookup_flags = LOOKUP_FOLLOW;\n',
                'extern int ksu_handle_faccessat(int *dfd, const char __user **filename_user,\n\t\t\t\tint *mode, int *flags);\n',
                '\tksu_handle_faccessat(&dfd, &filename, &mode, NULL);\n',
                '\tunsigned int lookup_flags = LOOKUP_FOLLOW;\n')

          # fs/stat.c
          patch('fs/stat.c',
                'int vfs_fstatat(int dfd, const char __user *filename, struct kstat *stat,\n\t\tint flag)\n{\n\tstruct path path;\n\tint error = -EINVAL;\n\tunsigned int lookup_flags = 0;\n',
                'extern int ksu_handle_stat(int *dfd, const char __user **filename_user,\n\t\t\t   int *flags);\n',
                '\tksu_handle_stat(&dfd, &filename, &flag);\n',
                '\tunsigned int lookup_flags = 0;\n')

          # fs/read_write.c
          patch('fs/read_write.c',
                'SYSCALL_DEFINE3(read, unsigned int, fd, char __user *, buf, size_t, count)\n{\n\tstruct fd f = fdget_pos(fd);\n\tssize_t ret = -EBADF;\n',
                'extern void ksu_handle_sys_read(unsigned int fd);\n',
                '\tksu_handle_sys_read(fd);\n',
                '\tssize_t ret = -EBADF;\n',
                replace=('\tstruct fd f = fdget_pos(fd);\n', '\tstruct fd f;\n'),
                post='\tf = fdget_pos(fd);\n')

          # drivers/input/input.c  (开机按音量下键进安全模式)
          patch('drivers/input/input.c',
                'static void input_handle_event(struct input_dev *dev,\n\t\t\t       unsigned int type, unsigned int code, int value)\n{\n\tint disposition = input_get_disposition(dev, type, code, &value);\n',
                'extern int ksu_handle_input_handle_event(unsigned int *type,\n\t\t\t\t\t unsigned int *code, int *value);\n',
                '\tksu_handle_input_handle_event(&type, &code, &value);\n',
                '\tint disposition;\n',
                replace=('\tint disposition = input_get_disposition(dev, type, code, &value);\n', '\tint disposition;\n'),
                post='\tdisposition = input_get_disposition(dev, type, code, &value);\n')

          # security/selinux/avc.c
          patch('security/selinux/avc.c',
                'noinline int slow_avc_audit(u32 ssid, u32 tsid, u16 tclass,\n\t\tu32 requested, u32 audited, u32 denied, int result,\n\t\tstruct common_audit_data *a,\n\t\tunsigned flags)\n{\n\tstruct common_audit_data stack_data;\n\tstruct selinux_audit_data sad;\n',
                'extern int ksu_handle_slow_avc_audit(u32 *tsid);\n',
                '\tksu_handle_slow_avc_audit(&tsid);\n',
                '\tstruct selinux_audit_data sad;\n')

      - name: KSU config fragment
        run: |
          # 原来的 CONFIG_KSU_KPROBE_HOOKS 这个选项根本不存在；
          # 4.9 上只能用手动 hook，不需要 kprobes。
          # LOG_BUF_SHIFT=20: 内核日志缓冲区 128KB -> 1MB，开机日志不会被很快冲掉，方便排查。
          printf '%s\n' \
            CONFIG_KSU=y \
            CONFIG_KSU_MANUAL_HOOK=y \
            CONFIG_LOG_BUF_SHIFT=20 \
            > arch/arm64/configs/ksu.config

      - name: Build
        run: |
          set -o pipefail
          ARGS="O=out ARCH=arm64 CC=clang LD=ld.lld \
            CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=$HOME/arm32/arm-linux-gnueabi- \
            AR=llvm-ar NM=llvm-nm OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip"
          make $ARGS sdm670-perf_defconfig xiaomi/sdm710-common.config xiaomi/grus.config ksu.config
          grep -E "CONFIG_KSU" out/.config
          make $ARGS -j$(nproc --all) 2>&1 | tee build.log
          grep -q "Hook mode: Manual" build.log
          test -f out/arch/arm64/boot/Image

      - name: Package AnyKernel3
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3 ak3
          rm -rf ak3/.git ak3/.github ak3/README.md ak3/modules ak3/patch ak3/ramdisk
          cp out/arch/arm64/boot/Image ak3/

          cat > ak3/anykernel.sh << 'EOF'
          ### AnyKernel3 Ramdisk Mod Script
          properties() { '
          kernel.string=grus KernelSU-Next
          do.devicecheck=1
          do.modules=0
          do.systemless=0
          do.cleanup=1
          do.cleanuponabort=0
          device.name1=grus
          device.name2=
          supported.versions=
          supported.patchlevels=
          '; }

          BLOCK=/dev/block/bootdevice/by-name/boot;
          IS_SLOT_DEVICE=0;
          RAMDISK_COMPRESSION=auto;
          PATCH_VBMETA_FLAG=auto;

          . tools/ak3-core.sh;

          split_boot;
          flash_boot;
          EOF
          sed -i 's/^          //' ak3/anykernel.sh

          cd ak3 && zip -r9 ../grus-KernelSU-Next-$(date +%Y%m%d).zip *

      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: grus-ksun
          path: |
            grus-KernelSU-Next-*.zip
            build.log
            out/.config
